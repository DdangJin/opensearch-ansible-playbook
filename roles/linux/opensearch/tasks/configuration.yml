---
- name: OpenSearch Configuration | Configure from .deb
  when: ansible_os_family == 'Debian'
  block:
    - name: OpenSearch Configuration | Ensure systemd override directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/opensearch.service.d"
        state: directory
        mode: "0755"

    - name: OpenSearch Configuration | Add LimitMEMLOCK to systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/opensearch.service.d/limits.conf"
        content: |
          [Service]
          # Specifies the memory lock settings
          LimitMEMLOCK=infinity
        mode: "0644"
      register: limit_memlock

    - name: OpenSearch Configuration | Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      when: limit_memlock.changed

    - name: OpenSearch Configuration | Set JVM heap size
      ansible.builtin.lineinfile:
        path: "{{ os_conf_dir }}/jvm.options"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        backup: yes
      loop:
        - { regexp: "^-Xms.+$", line: "-Xms{{ xms_value }}g" }
        - { regexp: "^-Xmx.+$", line: "-Xmx{{ xmx_value }}g" }

    - name: OpenSearch Configuration | Configure OPENSEARCH_JAVA_HOME
      ansible.builtin.lineinfile:
        path: "/etc/default/opensearch"
        regexp: "^#?OPENSEARCH_JAVA_HOME=.*$"
        line: "OPENSEARCH_JAVA_HOME={{ java_home }}"
        state: present
      when: java_home is not none

- name: OpenSearch Configuration | Configuration from tar
  when: ansible_os_family != 'Debian'
  block:
    - name: OpenSearch Configuration | Copy Configuration File
      ansible.builtin.blockinfile:
        block: "{{ lookup('template', 'templates/opensearch-{{ cluster_type }}.yml') }}"
        dest: "{{ os_conf_dir }}/opensearch.yml"
        backup: true
        state: present
        create: true
        marker: "## {mark} opensearch main configuration ##"
        owner: "{{ os_user }}"
        group: "{{ os_user }}"
        mode: 0640

    - name: OpenSearch Configuration | Copy jvm.options File for Instance
      ansible.builtin.template:
        src: jvm.options
        dest: "{{ os_conf_dir }}/jvm.options"
        owner: "{{ os_user }}"
        group: "{{ os_user }}"
        mode: 0640
        force: true
